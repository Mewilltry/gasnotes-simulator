<style>
    #connect-modal {
        /* max-width: 800px; */
        height: min-content;
    }

    #enter-the-simulation {
        margin: 1rem auto 2rem;
        text-align: center;
        text-transform: uppercase;
        font-weight: 800;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        line-height: 1.05;
        letter-spacing: 0.02em;
        display: none;
    }

    #sequence-box {
        margin: clamp(0rem, 2vw, 2rem);
    }

    #sequence-box > h2 {
        margin: 1.75rem 0 1rem;
        font-size: clamp(1.5rem, 5vw, 2rem);
    }

    #sequence-box > h2:first-of-type {
        margin-top: 0;
    }

    #sequence-connect {
        display: grid;
        grid-template-columns: auto auto 1fr;
        align-items: center;
        column-gap: 1rem;

        & .sim-qrcode {
            max-width: 300px;
        }

        & #sequence-connect-right {
            display: flex;
            flex-direction: column;
            gap: 0.75em;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        & .or-divider {
            align-self: stretch;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;

            &::before,
            &::after {
                content: "";
                flex: 1;
                border-left: 2px solid var(--light-grey);
            }
        }

        & .simcode {
            font-size: 2em;
            width: min-content;
        }
    }

    #sequence-mode-picker {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
    }

    @media (min-height: 800px) and (min-width: 630px) {
        #enter-the-simulation {
            display: block;
        }
    }

    @media (max-width: 630px) {
        #sequence-box > h2 {
            font-size: clamp(1.5rem, 7vw, 2rem);
        }

        #sequence-connect {
            grid-template-columns: 1fr;
            justify-items: center;
            row-gap: 1rem;

            img {
                margin-top: 1rem;
            }

            & .or-divider {
                flex-direction: row;
                width: 100%;

                &::before,
                &::after {
                    border-left: none;
                    border-top: 2px solid var(--light-grey);
                }
            }
        }

        #sequence-mode-picker {
            grid-template-columns: 1fr;
            grid-template-rows: auto;
            text-align: center;
            gap: 0.5rem;
        }
    }
</style>

<dialog class="tray" id="connect-modal" closedby="any">
    <h1 id="enter-the-simulation">Enter the<br />Simulation</h1>
    <div id="sequence-box">
        <h2>Scan QR</h2>
        <div id="sequence-connect">
            <img
                class="sim-qrcode"
                src="{{ qrcode(url_for('sim_controller', sim_room_id=data.sim_room_id, _external=True)) }}"
            />
            <div class="or-divider"><span>or</span></div>
            <div id="sequence-connect-right">
                <span
                    class="simcode"
                    aria-roledescription="button"
                    title="Click to copy SimCode"
                    >{{ data.sim_room_id }}</span
                >
                <span>Use a SimCode</span>
                <span><a href="/connect">Use this Code</a></span>
            </div>
        </div>

        <h2>Start Simulation</h2>
        <div id="sequence-mode-picker">
            <button
                form="dialog-closer"
                type="submit"
                class="button red"
                autofocus
            >
                Open Simulation
            </button>
            <span>or</span>
            <!-- <a class="button red" href="{{ url_for('sim_monitor', sim_room_id=data.sim_room_id) }}">Open Monitor</a> -->
            <a
                class="button green"
                href="{{ url_for('sim_controller', sim_room_id=data.sim_room_id) }}"
                >Switch to Controller</a
            >
        </div>
        <form method="dialog" id="dialog-closer"></form>
    </div>
</dialog>
